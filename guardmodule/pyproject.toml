[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardmodule"
version = "0.1.0"
description = "guardmodule.v1 pattern-detection Module (mock-LLM test harness phase)"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "gen"]
